name: Recruiting Deadline Sweep

on:
  schedule:
    # Every 15 minutes. After a round's deadline this submits complete drafts; before it, it does nothing.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions UI

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run the recruiting deadline sweep
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${SITE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::SITE_URL and CRON_SECRET must both be set as repository secrets"
            exit 1
          fi

          response=$(curl -s -L -w "\n%{http_code}" -X GET "${SITE_URL}/api/cron/recruiting" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Recruiting sweep failed with status $http_code"
            exit 1
          fi
